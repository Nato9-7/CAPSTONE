name: Build iOS (.ipa sin firmar)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rb_alertas
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar iOS sin firma
        run: flutter build ios --release --no-codesign

      - name: Empaquetar .ipa
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r rb_alertas.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: rb_alertas-ipa
          path: rb_alertas/rb_alertas.ipa
